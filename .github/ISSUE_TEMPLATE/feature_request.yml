name: Feature or improvement
description: Describe a focused user problem or contributor improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Who needs this and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and acceptance criteria
      description: Describe the smallest useful scope. Mention accessibility and mobile needs.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Alternatives, safety and compatibility
      description: Consider privacy, paid AI costs, ownership rules, data sources and explicit plan confirmation.
